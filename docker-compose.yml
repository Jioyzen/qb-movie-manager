version: "3.8"

services:
  qb-movie-manager:
    build: .
    container_name: qb-movie-manager
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      # 配置持久化：宿主机目录映射到容器 /config
      - ./config:/config
      # 媒体文件（本地路径模式）：宿主机 QB 下载目录映射到容器 /data
      # 修改为你的实际路径，例如：
      #   - /volume1/downloads:/data
      # 然后在 WebUI 配置中设置 本地路径 = /data
      # - /path/to/your/downloads:/data
    environment:
      # 配置文件的容器内路径（默认即可，无需修改）
      - QB_MOVIE_CONFIG=/config/config.json
      # TZ 设置
      - TZ=Asia/Shanghai
    # 容器内 SMB 挂载所需权限
    # 启用后可在 WebUI 配置 SMB 参数，由容器自动挂载远程共享
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined